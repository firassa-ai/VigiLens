[project]
name = "vigilens-backend"
version = "0.1.0"
description = "VigiLens backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn>=0.35.0",
  "sqlalchemy>=2.0.38",
  "greenlet>=3.2.0",
  "psycopg[binary]>=3.2.0",
  "httpx>=0.28.0",
  "google-genai>=1.0.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.10.0",
]

[dependency-groups]
dev = [
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
