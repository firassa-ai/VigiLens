services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: vigilens
      POSTGRES_PASSWORD: vigilens
      POSTGRES_DB: vigilens
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigilens -d vigilens"]
      interval: 5s
      timeout: 3s
      retries: 30

  evermemos-mongodb:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: memsys123
      MONGO_INITDB_DATABASE: memsys
    volumes:
      - evermemos_mongodb:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 8s
      retries: 20
      start_period: 30s

  evermemos-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      bootstrap.memory_lock: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - evermemos_elasticsearch:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 8s
      retries: 20
      start_period: 50s

  evermemos-etcd:
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >
      etcd
      -advertise-client-urls=http://127.0.0.1:2479
      -listen-client-urls=http://0.0.0.0:2479
      --data-dir=/etcd
    volumes:
      - evermemos_etcd:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2479", "endpoint", "health"]
      interval: 20s
      timeout: 8s
      retries: 20

  evermemos-minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    command: minio server /minio_data --console-address ":9001"
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - evermemos_minio:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 20s
      timeout: 8s
      retries: 20

  evermemos-milvus:
    image: milvusdb/milvus:v2.5.2
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: evermemos-etcd:2479
      MINIO_ADDRESS: evermemos-minio:9000
    volumes:
      - evermemos_milvus:/var/lib/milvus
    depends_on:
      evermemos-etcd:
        condition: service_healthy
      evermemos-minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9091/healthz"]
      interval: 20s
      timeout: 8s
      retries: 25
      start_period: 80s

  evermemos-redis:
    image: redis:7.2-alpine
    volumes:
      - evermemos_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 20

  evermemos:
    build:
      context: ./vendor/evermemos
      dockerfile: Dockerfile
    volumes:
      - ./vendor/evermemos/.env:/app/.env:ro
    environment:
      PYTHONUNBUFFERED: "1"
      OPENAI_API_KEY: ${OPENAI_API_KEY-}
      DEEPINFRA_API_KEY: ${DEEPINFRA_API_KEY-}
    ports:
      - "1995:1995"
    depends_on:
      evermemos-mongodb:
        condition: service_healthy
      evermemos-elasticsearch:
        condition: service_healthy
      evermemos-milvus:
        condition: service_healthy
      evermemos-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:1995/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 8s
      retries: 25
      start_period: 40s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://vigilens:vigilens@postgres:5432/vigilens
      EVERMEMOS_URL: http://evermemos:1995
      DEMO_MODE: "true"
      DEMO_DATA_DIR: /data/real
      GEMINI_API_KEY: ${GEMINI_API_KEY-}
      GEMINI_MODEL_DEFAULT: ${GEMINI_MODEL_DEFAULT-gemini-3-flash-preview}
      GEMINI_MODEL_REASONING: ${GEMINI_MODEL_REASONING-gemini-3.1-pro-preview}
      OPENFDA_LIVE_BACKGROUND: "false"
      CORS_ALLOW_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - ./data:/data:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      evermemos:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/v1/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

  seed:
    image: curlimages/curl:8.12.1
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/seed-demo.sh"]
    restart: "no"

volumes:
  pgdata:
  evermemos_mongodb:
  evermemos_elasticsearch:
  evermemos_etcd:
  evermemos_minio:
  evermemos_milvus:
  evermemos_redis:
